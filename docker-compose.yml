# NeuroCare Platform - Docker Compose (dev + prod)
# Usage: docker-compose -f docker-compose.yml up -d          (dev-ish defaults)
#        docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d   (local ports)
# Secrets: never commit real values — set them in the environment or a root .env

services:
  ###############################################################################
  # POSTGRESQL DATABASE
  ###############################################################################
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic}
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - neurocare-network

  ###############################################################################
  # DATABASE MIGRATION SERVICE (prisma migrate deploy)
  ###############################################################################
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prereqs
    command: ["sh", "-c", "pnpm --filter ./backend exec prisma migrate deploy"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://clinic:clinic@postgres:5432/clinic}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - neurocare-network

  ###############################################################################
  # BACKEND API SERVER
  ###############################################################################
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://clinic:clinic@postgres:5432/clinic}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-neurocare-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-neurocare-clients}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      VIDEO_DEV_MODE: ${VIDEO_DEV_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - neurocare-network

  ###############################################################################
  # FRONTEND NEXT.JS
  ###############################################################################
  frontend:
    build:
      context: .
      dockerfile: apps/neurocare-platform/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - neurocare-network

  ###############################################################################
  # MARKETING WEBSITE (Next.js)
  ###############################################################################
  web:
    build:
      context: .
      dockerfile: apps/marketing-site/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - neurocare-network

  ###############################################################################
  # REPORT ENGINE (Python/FastAPI)
  ###############################################################################
  report-engine:
    build:
      context: ./python-services/report-engine
    environment:
      PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - neurocare-network

  ###############################################################################
  # CLINICAL AI (Python/FastAPI)
  ###############################################################################
  clinical-ai:
    build:
      context: ./python-services/clinical-ai
    environment:
      PORT: 8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - neurocare-network

volumes:
  pgdata:

networks:
  neurocare-network:
    driver: bridge
