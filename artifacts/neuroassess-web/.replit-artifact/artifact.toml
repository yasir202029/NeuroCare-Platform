kind = "web"
previewPath = "/"
title = "NeuroAssess UK"
description = "A responsive healthcare platform for ADHD and autism assessments, patient care, clinician workflows, booking, reporting, and administration."
version = "1.0.0"
id = "artifacts/neuroassess-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18881

[services.development]
run = "pnpm --filter @workspace/neuroassess-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neuroassess-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/neuroassess-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18881"
BASE_PATH = "/"
