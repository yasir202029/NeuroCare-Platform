# Local port publishing (kept separate so production networks stay port-free by default).
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
  backend:
    ports:
      - "${BACKEND_PORT:-4000}:4000"
  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  web:
    ports:
      - "${WEB_PORT:-3001}:3001"

  report-engine:
    ports:
      - "${REPORT_ENGINE_PORT:-8000}:8000"

  clinical-ai:
    ports:
      - "${CLINICAL_AI_PORT:-8001}:8001"
